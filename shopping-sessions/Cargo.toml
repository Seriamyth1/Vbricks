[package]
name = "sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ahash = "0.8"
memchr = "2"
arrow-array = "55"
arrow-schema = "55"
parquet = { version = "55", default-features = false, features = ["arrow"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
